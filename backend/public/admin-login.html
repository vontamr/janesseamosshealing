<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login • Janesse's Seamoss</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">

    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-10">
        <h1 class="text-3xl font-light text-center mb-8">Admin Login</h1>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">Email</label>
                <input type="email" id="email" value="admin@janesseamoss.com" 
                       class="w-full p-4 border border-gray-300 rounded-2xl" required>
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" id="password" value="seamoss2026" 
                       class="w-full p-4 border border-gray-300 rounded-2xl" required>
            </div>

            <button type="submit" 
                    class="w-full bg-purple hover:bg-[#260B3A] text-white py-4 rounded-3xl font-semibold text-lg transition-all">
                Sign In
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');

            btn.textContent = "Signing in...";
            btn.disabled = true;

            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.error || 'Invalid credentials');
                    btn.textContent = "Sign In";
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Connection error. Is the server running?');
                btn.textContent = "Sign In";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
